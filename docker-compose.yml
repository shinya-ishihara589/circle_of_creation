services:
  backend:
    build: ./infra/docker/php
    container_name: backend
    command: php-fpm -F -d listen=0.0.0.0:9000
    volumes:
      - ./backend:/var/www/html
    networks:
      - app-net

  radio-server:
    image: node:20-alpine
    container_name: radio-server
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: node radio-server.js
    expose:
      - "8080"
    restart: always
    networks:
      - app-net

  frontend:
    image: node:20-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    restart: always
    networks:
      - app-net

  nginx:
    build: ./infra/docker/nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./infra/docker/nginx/ssl:/etc/nginx/conf.d/ssl
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html/cert-check
    depends_on:
      - backend
      - frontend
      - db
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my_database
      MYSQL_USER: my_user
      MYSQL_PASSWORD: user_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    networks:
        - app-net

volumes:
  cert-data:
  dbdata:

networks:
  app-net:
    driver: bridge
