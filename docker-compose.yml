services:
  backend:
    build: ./infra/docker/php
    container_name: backend
    # network_mode: host を削除
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host # 👈 WSL2の9000番を直接コンテナに繋ぎます
    volumes:
      - ./backend:/var/www/html

  radio-server:
    image: node:20-alpine
    container_name: radio-server
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host # 👈 WSL2の8080番を直接コンテナに繋ぎます
    command: sh -c "npm install && node radio-server.js"
    restart: always

  nginx:
    build: ./infra/docker/nginx
    container_name: nginx
    # network_mode: host を削除
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host # 👈 WSL2の80番を直接コンテナに繋ぎます
      - target: 443
        published: 443
        protocol: tcp
        mode: host # 👈 WSL2の443番を直接コンテナに繋ぎます
    volumes:
      - ./backend/:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./infra/docker/nginx/ssl:/etc/nginx/conf.d/ssl
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html/cert-check
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql
    # network_mode: host を削除
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
        mode: host # 👈 WSL2の3306番を直接コンテナに繋ぎます
    restart: always
    volumes:
      - dbdata:/var/lib/mysql

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  cert-data:
  dbdata:
