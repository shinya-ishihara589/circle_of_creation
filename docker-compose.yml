services:
  backend:
    build: ./infra/docker/php
    container_name: backend
    network_mode: host # 👈 【修正】WSL2のネットワークと直結させます
    volumes:
      - ./backend:/var/www/html

  radio-server:
    image: node:20-alpine
    container_name: radio-server
    network_mode: host # 👈 【修正】WSL2のネットワークと直結させます
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: sh -c "npm install && node radio-server.js"
    restart: always

  nginx:
    build: ./infra/docker/nginx
    container_name: nginx
    network_mode: host # 👈 【修正】WSL2のネットワークと直結させます
    # 💡 network_mode: host の場合、ports（ポート公開設定）の記述は不要になります。
    # WSL2の80番と443番ポートを、コンテナ内のNginxが直接ガッチリと掴んで待ち受けます。
    volumes:
      - ./backend/:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html/cert-check
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql
    network_mode: host # 👈 【修正】WSL2のネットワークと直結させます
    restart: always
    volumes:
      - dbdata:/var/lib/mysql

  certbot:
    image: certbot/certbot
    container_name: certbot
    network_mode: host # 👈 【修正】WSL2のネットワークと直結させます
    volumes:
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  cert-data:
  dbdata:
