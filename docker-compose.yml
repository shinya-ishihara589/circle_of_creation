services:
  backend:
    build: ./infra/docker/php
    container_name: backend
    volumes:
      - ./backend:/var/www/html

  radio-server:
    image: node:20-alpine
    container_name: radio-server
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: sh -c "npm install && node radio-server.js"
    expose:
      - "8080"
    restart: always

  nginx:
    build: ./infra/docker/nginx
    container_name: nginx
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 8443
        protocol: tcp
        mode: host
    volumes:
      # 👇 元の設定をすべて消し、この1行だけにします（指定ファイルのみを強制マウント）
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
  db:
    image: mysql:8.0
    container_name: mysql
    restart: always
    volumes:
      - dbdata:/var/lib/mysql

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  cert-data:
  dbdata:
