services:
  backend:
    build: ./infra/docker/php
    container_name: backend
    network_mode: host # 👈 【修正】WSL2のネットワークと完全に一体化させます
    # 💡 network_mode: host にするため、ports: の記述はすべて削除します
    volumes:
      - ./backend:/var/www/html

  radio-server:
    image: node:20-alpine
    container_name: radio-server
    network_mode: host # 👈 【修正】
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: sh -c "npm install && node radio-server.js"
    restart: always

  nginx:
    build: ./infra/docker/nginx
    container_name: nginx
    network_mode: host # 👈 【修正】WSL2のネットワークと完全に一体化させます
    # 💡 network_mode: host にするため、ports: の記述はすべて削除します
    volumes:
      - ./backend/:/var/www/html
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./infra/docker/nginx/ssl:/etc/nginx/conf.d/ssl
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html/cert-check
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: mysql
    network_mode: host # 👈 【修正】
    restart: always
    volumes:
      - dbdata:/var/lib/mysql

  certbot:
    image: certbot/certbot
    container_name: certbot
    network_mode: host # 👈 【修正】
    volumes:
      - cert-data:/etc/letsencrypt
      - ./infra/docker/nginx/html:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"

volumes:
  cert-data:
  dbdata:
