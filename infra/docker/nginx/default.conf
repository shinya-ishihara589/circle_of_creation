log_format check_ip '【Nginx前(生IP)】: $remote_addr | 【Nginx後(転送IP)】: $http_x_forwarded_for | リクエスト: "$request"';

server {
    # 👇 sslを外し、通常のHTTPとして8443番ポートを待ち受けます
    listen 8443;
    server_name www.squreation.com 127.0.0.1 localhost;

    access_log /var/log/nginx/access.log check_ip;

    # 💡 証明書の読み込み設定（エラーの原因）をすべてコメントアウトして無視させます
    # ssl_certificate     /etc/letsencrypt/live/www.squreation.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/://squreation.com;

    root /var/www/html/public;
    index index.php index.html;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /ws/ {
        proxy_pass http://radio-server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # 💡 HTTPSを一時的にオフにします
        # fastcgi_param HTTPS on;

        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }   
}
